name: Maintenance reminders

on:
  schedule:
    # Daily at 06:00 UTC = 08:00 in Cairo in winter (UTC+2), 09:00 in summer (UTC+3).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if nothing changed since the last reminder"
        type: boolean
        default: false
      dry_run:
        description: "Print the email in the log instead of sending"
        type: boolean
        default: false

permissions:
  contents: write   # lets the job commit data/state.json (remembers what was already reminded)

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send reminders
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TO: ${{ secrets.REMINDER_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/send_reminders.py $ARGS

      - name: Save reminder state
        run: |
          git config user.name "maintenance-bot"
          git config user.email "maintenance-bot@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update reminder state"
            git pull --rebase
            git push
          fi
