<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3864">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>صيانة العربية</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <section id="login" class="card narrow">
    <h1>🔧 صيانة العربية</h1>
    <p class="muted">سجّل دخول بحساب Gmail اللي مشارك معاه الشيت. البيانات بتتحمّل من Google Sheet الخاص بيك.</p>
    <button id="signin" class="primary" disabled>الدخول بحساب Google</button>
    <p id="loginMsg" class="err"></p>
  </section>

  <main id="app" hidden>
    <header class="top">
      <h1>🔧 صيانة جراند i10</h1>
      <div class="who"><span id="whoEmail" dir="ltr"></span> <button id="logout" class="ghost">خروج</button></div>
    </header>

    <section class="card odo">
      <label for="odoInput">العداد الحالي (كم)</label>
      <div class="row">
        <input id="odoInput" type="number" inputmode="numeric" min="0">
        <button id="odoSave" class="primary">تحديث العداد</button>
      </div>
      <div id="pills" class="pills"></div>
    </section>

    <nav class="tabs">
      <button data-tab="items" class="active">الصيانة</button>
      <button data-tab="log">السجل</button>
      <button data-tab="settings">الإعدادات</button>
    </nav>

    <section id="view"></section>
  </main>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
